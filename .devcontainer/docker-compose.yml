# 각 DBMS = 별도 컨테이너(사용자 09-12 "각 DBMS별 docker 방식"). 기본 기동 = dev·oracle·mssql,
# postgres·mysql은 프로필(`docker compose --profile pg --profile mysql up`).
# ★ 최소 사양 Codespaces(2코어·8GB · 사용자 09-13 "느려도 괜찮다"): DB 메모리 상한 oracle 2g · mssql 1.5g,
#   Rust 빌드 병렬 1(CARGO_BUILD_JOBS). 메모리가 모자라면 `docker compose stop mssql`처럼 안 쓰는 DB를 내리면 된다.
services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/nexa-sql:cached
      - nexa-ui:/workspaces/nexa-ui
      - cargo-registry:/usr/local/cargo/registry
      - target:/workspaces/nexa-sql/target
    command: sleep infinity
    # DB healthy를 기다리지 않는다 — 개발 컨테이너는 먼저 뜨고, DB는 scripts/wait-for-db.sh로 확인.
    depends_on: [oracle, mssql]

  oracle:
    # Oracle Database Free 23ai(gvenzl 커뮤니티 이미지 · amd64). 서비스 FREEPDB1 · 앱 사용자 nexa/nexa.
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: Nexa_Sql2026
      APP_USER: nexa
      APP_USER_PASSWORD: nexa
    ports: ["1521:1521"]
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    volumes:
      - oracle-data:/opt/oracle/oradata

  mssql:
    # SQL Server 2022 Developer. sa 비밀번호는 정책(대문자·숫자·특수문자·8자+) 충족.
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Nexa@Sql2026"
      MSSQL_PID: Developer
      # 엔진 메모리 상한(MB) — 컨테이너 1.5g 안에서 동작.
      MSSQL_MEMORY_LIMIT_MB: "1024"
    ports: ["1433:1433"]
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Nexa@Sql2026' -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  postgres:
    profiles: ["pg"]
    image: postgres:17
    environment:
      POSTGRES_USER: nexa
      POSTGRES_PASSWORD: nexa
      POSTGRES_DB: nexa
    ports: ["5432:5432"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexa"]
      interval: 5s
      retries: 20

  mysql:
    profiles: ["mysql"]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: nexa
      MYSQL_USER: nexa
      MYSQL_PASSWORD: nexa
      MYSQL_DATABASE: nexa
    ports: ["3306:3306"]
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pnexa"]
      interval: 5s
      retries: 20

volumes:
  nexa-ui:
  cargo-registry:
  target:
  oracle-data:
