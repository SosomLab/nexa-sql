# drivers — 태그 `drivers-v*` push → 3-OS 확장 드라이버 패키지(zip + .sha256 + Ed25519 .sig) + 오프라인 번들 → GitHub **pre-release**
#   + `drivers/index.json` 갱신 커밋(D-350 · docs/22 §2-3·§3 · docs/33 §5-5-1).
#
# 원칙: 드라이버 릴리스는 **모두 pre-release**로 올린다(앱의 `releases/latest`를 가로채지 않게 · homebrew/linux-repo 가드) · 자산 이름 =
#   `nsql-driver-<id>-<ver>-<os>-<arch>.zip` · 한 태그에 전 드라이버(tag_prefix = `drivers-v`) · 서명 없이는 올리지 않는다(본체가 거부).
# 서명 시크릿(필수): NEXA_DRIVER_KEY_B64 = `nexa-license-tool keygen`이 만든 봉투 파일의 base64 · NEXA_DRIVER_KEY_PASS = 그 암호.
#   공개키 = drivers/keys/drv-v1.key.pub(저장소) = crates/nsql-drivers/src/ext/keys.rs(본체 내장).
# ★ nexa-sql은 형제 저장소 ../nexa-ui · ../nexa-license를 path 의존한다 → release.yml과 같이 나란히 체크아웃.
name: drivers

on:
  push:
    tags: ["drivers-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "드라이버 릴리스 태그(예: drivers-v0.1.0)"
        required: true
        type: string

permissions:
  contents: write # pre-release 생성 · index.json 커밋

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: nexa-sql

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/drivers-v* ]]; then tag="$GITHUB_REF_NAME"; else tag="${{ inputs.tag }}"; fi
          case "$tag" in drivers-v*) ;; *) echo "::error::태그는 drivers-v<ver> 꼴이어야 한다: $tag"; exit 1 ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"; echo "version=${tag#drivers-v}" >> "$GITHUB_OUTPUT"

  package:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            slug: linux
            arch: x86_64
            target: ""
          - os: windows-latest
            slug: windows
            arch: x86_64
            target: ""
          - os: macos-latest
            slug: macos
            arch: aarch64
            target: ""
          # ★ T-401(10-23 탐침 39895580517): Intel 러너 `macos-15-intel`(x86_64 · macOS 15.7 · brew /usr/local · libodbc x86_64)에서 네이티브 빌드 —
          #   arm64 러너 교차 빌드는 brew libodbc가 arm64뿐이라 ODBC를 못 넣었다(drivers-v0.1.2) → 이제 ODBC 4 OS. (macos-13은 더 이상 배정되지 않는다.)
          - os: macos-15-intel
            slug: macos
            arch: x86_64
            target: ""
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      RUSTUP_TOOLCHAIN: stable
      NEXA_DRIVER_KEY_PASS: ${{ secrets.NEXA_DRIVER_KEY_PASS }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: nexa-sql
      - uses: actions/checkout@v4
        with:
          repository: SosomLab/nexa-ui
          path: nexa-ui
      - uses: actions/checkout@v4
        with:
          repository: SosomLab/nexa-license
          path: nexa-license
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            nexa-sql
            nexa-license
          key: drivers-${{ matrix.slug }}-${{ matrix.arch }}
      # ★ libduckdb-sys `download-lib`의 OUT_DIR(duckdb.lib/.dll ≈ 60 MB)이 rust-cache **정확 일치** 복원에서 빠져 링크가 LNK1181로 실패했다
      #   (10-23 ci 39874763926 Windows · 부분 일치 복원은 빌드 스크립트가 다시 돌아 ✓) → 복원 뒤 그 크레이트 산출만 지워 다시 내려받게 한다.
      - name: DuckDB 런타임 캐시 비우기(rust-cache 뒤 · LNK1181)
        shell: bash
        run: rm -rf target/*/build/libduckdb-sys-* target/*/*/build/libduckdb-sys-* nexa-sql/target/*/build/libduckdb-sys-* nexa-sql/target/*/*/build/libduckdb-sys-*
      - name: unixODBC(Linux · 빌드 링크용 · 런타임 = 사용자 시스템 libodbc)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq unixodbc-dev
      - name: unixODBC(macOS)
        if: runner.os == 'macOS'
        run: |
          brew install unixodbc
          echo "LIBRARY_PATH=$(brew --prefix unixodbc)/lib:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - name: macOS x86_64 타깃
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - name: 드라이버 cdylib 빌드
        shell: bash
        run: |
          set -euo pipefail
          pk=(-p nsql-driver-sqlite -p nsql-driver-pg -p nsql-driver-mysql -p nsql-driver-mssql -p nsql-driver-oracle-thin -p nsql-driver-oracle -p nsql-driver-duckdb)
          # macOS 기본 bash 3.2는 `set -u`에서 빈 배열 "${a[@]}"를 unbound로 본다(첫 실행 실패) → ${VAR:+…}로.
          TARGET="${{ matrix.target }}"
          # ODBC = 4 OS(T-401 · x86_64 맥은 Intel 러너 네이티브라 brew libodbc가 x86_64).
          pk+=(-p nsql-driver-odbc)
          cargo build --release --locked "${pk[@]}" ${TARGET:+--target "$TARGET"}
      - name: 패키지(zip + 매니페스트)
        shell: bash
        run: |
          set -euo pipefail
          dir=target/release; [ -n "${{ matrix.target }}" ] && dir="target/${{ matrix.target }}/release"
          python3 scripts/package-drivers.py --version "$VERSION" --target-dir "$dir" --os "${{ matrix.slug }}" --arch "${{ matrix.arch }}" --out out
      - name: 서명 도구(nexa-license-tool)
        shell: bash
        run: cargo build --release --manifest-path ../nexa-license/Cargo.toml -p nexa-license-tool # nexa-license는 Cargo.lock 미커밋 → --locked 없이
      - name: 서명 + 검증(.sig · .sha256)
        shell: bash
        env:
          KEY_B64: ${{ secrets.NEXA_DRIVER_KEY_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEY_B64" ] || [ -z "$NEXA_DRIVER_KEY_PASS" ]; then
            echo "::error::NEXA_DRIVER_KEY_B64 / NEXA_DRIVER_KEY_PASS 시크릿이 없다 — 서명 없는 드라이버는 본체가 거부하므로 올리지 않는다"; exit 1
          fi
          key="$RUNNER_TEMP/drv.key"; echo "$KEY_B64" | base64 --decode > "$key"
          tool=../nexa-license/target/release/nexa-license-tool; [ -x "$tool" ] || tool="$tool.exe"
          "$tool" sign-file out/nsql-driver-*.zip --key "$key" --pass-env NEXA_DRIVER_KEY_PASS
          "$tool" verify-file out/nsql-driver-*.zip --pub drivers/keys/drv-v1.key.pub
          rm -f "$key"
      - name: 오프라인 번들
        shell: bash
        run: python3 scripts/bundle-drivers.py --version "$VERSION" --os "${{ matrix.slug }}" --arch "${{ matrix.arch }}" --dir out
      - uses: actions/upload-artifact@v4
        with:
          name: drivers-${{ matrix.slug }}-${{ matrix.arch }}
          path: nexa-sql/out/*
          if-no-files-found: error

  publish:
    needs: [meta, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: nexa-sql
          ref: main # index.json 커밋은 main에
      - uses: actions/download-artifact@v4
        with:
          path: nexa-sql/staged
          pattern: drivers-*
          merge-multiple: true
      - name: 릴리스 노트
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          cat > notes.md <<EOF
          # Nexa SQL extension drivers $VERSION

          Driver packages for Nexa SQL (installed automatically on first connect, or with \`nsql driver install <id>\`).
          Each \`.zip\` ships with \`.sha256\` and an Ed25519 \`.sig\`; Nexa SQL refuses unsigned packages.
          Offline: download \`nsql-drivers-all-$VERSION-<os>-<arch>.zip\` and run \`nsql driver install --file <that zip>\` (or View ▸ Drivers).

          Nexa SQL 확장 드라이버 패키지입니다. 처음 접속할 때 자동으로 내려받아 설치되며, \`nsql driver install <id>\`로도 설치합니다.
          폐쇄망은 \`nsql-drivers-all-$VERSION-<os>-<arch>.zip\` 하나를 받아 \`nsql driver install --file\`로 전부 설치합니다.
          EOF
      - name: pre-release 생성/갱신
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          (cd staged && sha256sum * > sha256sums.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" staged/* --clobber
          else
            gh release create "$TAG" staged/* --prerelease --title "Nexa SQL drivers ${TAG#drivers-v}" --notes-file notes.md
          fi
      - name: drivers/index.json 갱신 커밋
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/update-driver-index.py --version "$VERSION" --assets-dir staged
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drivers/index.json
          git diff --cached --quiet && { echo "index.json 변화 없음"; exit 0; }
          git commit -m "drivers: index.json → latest $VERSION (drivers.yml)"
          git push origin HEAD:main
