# CI — "main은 항상 green"(docs/16 §3). 3타깃 × fmt/clippy/test.
# ★ nexa-sql은 형제 저장소 ../nexa-ui를 path 의존한다(DR-4) → 두 저장소를 나란히 체크아웃한다.
name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: nexa-sql

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: nexa-sql
      - uses: actions/checkout@v4
        with:
          repository: SosomLab/nexa-ui
          path: nexa-ui
      - uses: actions/checkout@v4 # 형제 저장소 ../nexa-license(공개 · 검증 전용 · DR-25) — nsql-license가 path 의존
        with:
          repository: SosomLab/nexa-license
          path: nexa-license
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nexa-sql
      # Linux 러너: 한글 폰트(nexa-font 실측) — 빌드 자체는 시스템 라이브러리 불요(Wayland/X11 dlopen).
      # ★ libduckdb-sys `download-lib`의 OUT_DIR(duckdb.lib/.dll ≈ 60 MB)이 rust-cache **정확 일치** 복원에서 빠져 링크가 LNK1181로 실패했다
      #   (10-23 ci 39874763926 Windows · 부분 일치 복원은 빌드 스크립트가 다시 돌아 ✓) → 복원 뒤 그 크레이트 산출만 지워 다시 내려받게 한다.
      - name: DuckDB 런타임 캐시 비우기(rust-cache 뒤 · LNK1181)
        shell: bash
        run: rm -rf target/*/build/libduckdb-sys-* target/*/*/build/libduckdb-sys-* nexa-sql/target/*/build/libduckdb-sys-* nexa-sql/target/*/*/build/libduckdb-sys-*
      - name: fonts (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core fonts-noto-core unixodbc-dev
        working-directory: .
      # ODBC 크레이트가 전 OS에서 컴파일된다(10-24 · 확장 전용) — 링크(시험 바이너리)에 unixODBC가 필요.
      - name: unixODBC (macos)
        if: runner.os == 'macOS'
        run: |
          brew install unixodbc
          echo "LIBRARY_PATH=$(brew --prefix unixodbc)/lib:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"
        working-directory: .

      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # ★ 확장 드라이버 cdylib 왕복(nsql-driver-dyn roundtrip)은 산출물이 있어야 돈다 — `cargo test`만으로는 cdylib이 없을 수 있어
      #   건너뛸 위험이 있었다(10-26 140차 mac · ci 40330077699 "0.00s"는 건너뜀의 근거가 못 된다 = journal 10-26 §5-2 정정) → 먼저 빌드해
      #   실제 ABI 경계를 시험하고, CI(`CI` 변수)에서는 산출물이 없으면 시험이 **실패**한다(조용한 건너뜀 금지 · 10-27).
      - name: sqlite cdylib (dyn roundtrip)
        run: cargo build -p nsql-driver-sqlite
      - name: test
        run: cargo test --workspace
      - name: smoke (fonts · drivers)
        run: cargo run -q -p nexa-sql -- --smoke
      # ★ T-458(11-01 · 사용자 "리눅스는 xvfb로" · D-435): GUI 기능 점검을 Xvfb 가상 디스플레이에서 — scripts/lib/xvfb.sh가 스크립트를
      #   xvfb-run 아래로 다시 띄운다(창은 러너 화면에 뜨지 않음 · 키 주입 0). 1단계 = 기동·창 수·덤프 판정 시나리오 일부(Debug exe ·
      #   FC_WAIT_SCALE 2 = 기동 지연 보정). 2단계(전수)는 시간 실측 뒤 · 맥·윈도우 동일 기법 = T-459 헤드리스 백엔드.
      #   ★ 1차 실행(ci 41214096070) = 앱이 Xvfb 안에서 즉시 종료(5/5 exited · 원인 원문 없음) → winit X11 런타임(libxkbcommon · xcb · xcursor…)을
      #   함께 설치하고, 실패하면 stderr·ldd를 바로 출력한다(산출물 업로드 없이 로그로).
      - name: xvfb func-check (linux · subset)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq xvfb x11-utils libxkbcommon0 libxkbcommon-x11-0 libx11-xcb1 libxcb-shm0 libxcb-render0 libxcb-xfixes0 libxcb-randr0 libxcursor1 libxi6 libxrandr2
          cargo build -q -p nexa-sql -p nsql-cli
          scripts/linux-func-check.sh -o target/func-check -e target/debug/nexa-sql -n target/debug/nsql -O S01,S02,S03,S04,S05
          tail -n 3 target/func-check/func-check.txt
          # ★ T-459(D-436): 헤드리스(창 숨김 · 스스로 그리기 · `capture:` PNG) — Linux도 같은 길(Xvfb 위).
          NSQL_HOME=target/func-check/home NSQL_HEADLESS=1 NSQL_STARTUP_CMD="@after:2500:capture:target/func-check/headless.png" \
            xvfb-run -a target/debug/nexa-sql & HP=$!; sleep 7; kill $HP 2>/dev/null; wait $HP 2>/dev/null || true
          test -s target/func-check/headless.png && head -c 8 target/func-check/headless.png | od -An -c && ls -l target/func-check/headless.png
      - name: xvfb func-check diagnostics (on failure)
        if: runner.os == 'Linux' && failure()
        run: |
          for f in target/func-check/S0*.stderr.txt target/func-check/S0*.stdout.txt; do echo "== $f"; head -n 40 "$f" 2>/dev/null; done
          echo "== ldd"; ldd target/debug/nexa-sql | grep -iE "not found|xkb|xcb|x11" || true
          echo "== direct run"; NSQL_HOME=target/func-check/home NSQL_STARTUP_CMD="@after:800:file.exit" xvfb-run -a target/debug/nexa-sql; echo "rc=$?"

  # ★ T-10 라이선스 게이트(10-29 168차): deny.toml 허용 목록 밖(카피레프트 등)·읽을 수 없는 라이선스 = 실패. 형제 저장소는 path 의존이라 함께 체크아웃.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: nexa-sql
      - uses: actions/checkout@v4
        with:
          repository: SosomLab/nexa-ui
          path: nexa-ui
      - uses: actions/checkout@v4
        with:
          repository: SosomLab/nexa-license
          path: nexa-license
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources
          manifest-path: nexa-sql/Cargo.toml
