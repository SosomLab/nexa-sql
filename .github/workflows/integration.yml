# 실서버 통합 테스트 — 각 DBMS를 서비스 컨테이너로(사용자 09-12 "각 DBMS별 docker"). main push · PR · 수동.
# Oracle Free 23ai(gvenzl) + SQL Server 2022 + PostgreSQL 17 + MySQL 8.4(135차 · devcontainer `mysql` 프로필과 같은 정의) + MariaDB 11.4(137차 · 3307) + ClickHouse 24.8(138차 · 8123 HTTP · 확장 전용 드라이버).
# ★ 137차(D-350 · 사용자 10-23 "테스트 자동화"): 같은 잡에서 **확장 경로**(NSQL_TEST_DYN=1 · cdylib 8종 · ABI v2)로 한 번 더 · MariaDB는 mysql 시험을 3307로 다시.
name: integration
on:
  push:
    branches: [main]
    paths: ["crates/**", "Cargo.*", ".github/workflows/integration.yml"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  NSQL_ORACLE_URL: oracle://nexa:nexa@localhost:1521/FREEPDB1
  NSQL_MSSQL_URL: mssql://sa:Nexa%40Sql2026@localhost:1433/master
  ORACLE_HOST: localhost
  MSSQL_HOST: localhost
  # scripts/wait-for-db.sh — 서비스 컨테이너는 러너의 localhost로 나온다(기본값 `postgres`는 devcontainer의 호스트 이름).
  POSTGRES_HOST: localhost
  NSQL_PG_URL: postgres://nexa:nexa@localhost:5432/nexa
  MYSQL_HOST: localhost
  NSQL_MYSQL_URL: mysql://nexa:nexa@localhost:3306/nexa
  CLICKHOUSE_HOST: localhost
  NSQL_CLICKHOUSE_URL: clickhouse://nexa:nexa@localhost:8123/nexa
  # ODBC(T-383 · D-345) = 내장 드라이버가 Windows 전용이라 이 Linux 잡에서는 `odbc_` 시험이 건너뛴다(실측 = Windows 로컬 · 저장 프로필).
  LD_LIBRARY_PATH: /opt/oracle/instantclient

defaults:
  run:
    working-directory: nexa-sql

jobs:
  it:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: Nexa_Sql2026
          APP_USER: nexa
          APP_USER_PASSWORD: nexa
        ports: ["1521:1521"]
        options: >-
          --health-cmd "healthcheck.sh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 60
          --health-start-period 60s
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Nexa@Sql2026"
          MSSQL_PID: Developer
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Nexa@Sql2026' -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nexa
          POSTGRES_PASSWORD: nexa
          POSTGRES_DB: nexa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: nexa
          MYSQL_USER: nexa
          MYSQL_PASSWORD: nexa
          MYSQL_DATABASE: nexa
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pnexa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: nexa
          MARIADB_USER: nexa
          MARIADB_PASSWORD: nexa
          MARIADB_DATABASE: nexa
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_USER: nexa
          CLICKHOUSE_PASSWORD: nexa
          CLICKHOUSE_DB: nexa
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["8123:8123"]
        options: >-
          --health-cmd "clickhouse-client --user nexa --password nexa --query 'SELECT 1' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: nexa-sql
      - uses: actions/checkout@v4
        with:
          repository: SosomLab/nexa-ui
          path: nexa-ui
      - uses: actions/checkout@v4 # 형제 저장소 ../nexa-license(공개 · 검증 전용 · DR-25) — nsql-license가 path 의존
        with:
          repository: SosomLab/nexa-license
          path: nexa-license
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nexa-sql
      # ★ libduckdb-sys `download-lib`의 OUT_DIR(duckdb.lib/.dll ≈ 60 MB)이 rust-cache **정확 일치** 복원에서 빠져 링크가 LNK1181로 실패했다
      #   (10-23 ci 39874763926 Windows · 부분 일치 복원은 빌드 스크립트가 다시 돌아 ✓) → 복원 뒤 그 크레이트 산출만 지워 다시 내려받게 한다.
      - name: DuckDB 런타임 캐시 비우기(rust-cache 뒤 · LNK1181)
        shell: bash
        run: rm -rf target/*/build/libduckdb-sys-* target/*/*/build/libduckdb-sys-* nexa-sql/target/*/build/libduckdb-sys-* nexa-sql/target/*/*/build/libduckdb-sys-*
      - name: Oracle Instant Client (basiclite · linux x64)
        working-directory: .
        run: |
          sudo apt-get update && sudo apt-get install -y libaio1t64 unzip fonts-noto-cjk unixodbc-dev odbc-postgresql
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libaio.so.1t64 /usr/lib/x86_64-linux-gnu/libaio.so.1 || true
          sudo mkdir -p /opt/oracle && cd /opt/oracle
          sudo curl -fsSL -o ic.zip https://download.oracle.com/otn_software/linux/instantclient/instantclient-basiclite-linuxx64.zip
          sudo unzip -q ic.zip && sudo rm ic.zip && sudo mv instantclient_* instantclient
          ls /opt/oracle/instantclient | head
      # ★ T-70 후속(158차 · 사용자 10-28 결정): 자체 서명 CA로 서명한 서버 인증서(SAN = localhost · 127.0.0.1)로 **TLS 켠 PG**를 하나 더(5434)
      #   → `pg_tls_modes_follow_url_param`이 모드 5종 · 인증서 오류 원문 · CA 파일 검증 · TLS 중 취소를 본다(내장·확장 두 경로). 서비스
      #   컨테이너는 인증서 파일을 넣을 수 없어 단계에서 docker run.
      - name: PostgreSQL TLS container (self-signed CA · port 5434)
        working-directory: .
        run: |
          mkdir -p pgtls && cd pgtls
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 2 -subj "/CN=nexa-test-ca"
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj "/CN=localhost"
          printf "subjectAltName=DNS:localhost,IP:127.0.0.1\n" > san.cnf
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 2 -extfile san.cnf
          sudo chown 999:999 server.key server.crt && sudo chmod 600 server.key
          docker run -d --name pgtls -p 5434:5432 -e POSTGRES_USER=nexa -e POSTGRES_PASSWORD=nexa -e POSTGRES_DB=nexa \
            -v "$PWD/server.crt:/certs/server.crt:ro" -v "$PWD/server.key:/certs/server.key:ro" \
            postgres:17 -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key
          for i in $(seq 1 30); do docker exec pgtls pg_isready -U nexa -h localhost && break; sleep 2; done
          docker exec pgtls psql -U nexa -d nexa -c "SHOW ssl"
          echo "NSQL_PG_TLS_URL=postgres://nexa:nexa@localhost:5434/nexa" >> "$GITHUB_ENV"
          echo "NSQL_PG_TLS_CA=$PWD/ca.crt" >> "$GITHUB_ENV"
      # ★ T-3 SSH 터널(159차 · D-382): sshd 컨테이너(키 인증 · 2222) → 터널 대상 = 러너의 PG 서비스(host.docker.internal:5432) ·
      #   known_hosts 선등록(BatchMode) · `pg_ssh_tunnel_round_trip`이 `?ssh=nexa@localhost:2222&ssh_key=…`로 접속한다.
      - name: SSH server container (openssh-server · key auth · port 2222)
        working-directory: .
        run: |
          mkdir -p sshtun && ssh-keygen -q -t ed25519 -N "" -f sshtun/id_ed25519
          # 서비스 컨테이너 네트워크에 붙여 서비스 이름(postgres)으로 터널 대상 지정 — 러너 게시 포트(host-gateway)는 userland-proxy 없는
          # 러너에서 컨테이너 안에서 닿지 않는다(40674556827 "Connection reset by peer"). 네트워크를 못 찾으면 host-gateway 폴백.
          NET=$(docker network ls --format '{{.Name}}' | grep -m1 github_network || true)
          if [ -n "$NET" ]; then TARGET=postgres; NETOPT="--network $NET"; else TARGET=host.docker.internal; NETOPT="--add-host=host.docker.internal:host-gateway"; fi
          echo "ssh tunnel target = $TARGET (network ${NET:-bridge})"
          docker run -d --name sshtun -p 2222:2222 $NETOPT \
            -e PUID=1000 -e PGID=1000 -e USER_NAME=nexa -e PUBLIC_KEY="$(cat sshtun/id_ed25519.pub)" \
            -e SUDO_ACCESS=false -e PASSWORD_ACCESS=false lscr.io/linuxserver/openssh-server:latest
          for i in $(seq 1 30); do ssh-keyscan -p 2222 -T 3 localhost 2>/dev/null | grep -q ed25519 && break; sleep 2; done
          mkdir -p ~/.ssh && chmod 700 ~/.ssh && ssh-keyscan -p 2222 localhost >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes -p 2222 -i sshtun/id_ed25519 nexa@localhost true && echo "ssh login ok"
          docker exec sshtun sh -c "nc -z -w 3 $TARGET 5432 && echo 'sshd -> pg reachable'" || echo "WARN: sshd cannot reach $TARGET:5432"
          echo "NSQL_SSH_PG_URL=postgres://nexa:nexa@$TARGET:5432/nexa?ssh=nexa@localhost:2222&ssh_key=$PWD/sshtun/id_ed25519" >> "$GITHUB_ENV"
      - name: wait for DBs
        run: bash scripts/wait-for-db.sh
      - name: integration tests
        run: cargo test -p nsql-drivers --test integration -- --nocapture --test-threads=1
      - name: integration tests (MariaDB 11.4 · mysql 시험을 3307로)
        env:
          NSQL_MYSQL_URL: mysql://nexa:nexa@localhost:3307/nexa
        run: cargo test -p nsql-drivers --test integration mysql -- --nocapture --test-threads=1
      - name: extension drivers (cdylib 9종 · duckdb = download-lib · clickhouse = HTTP)
        run: cargo build -p nsql-driver-sqlite -p nsql-driver-pg -p nsql-driver-mysql -p nsql-driver-mssql -p nsql-driver-oracle-thin -p nsql-driver-oracle -p nsql-driver-duckdb -p nsql-driver-clickhouse -p nsql-driver-odbc
      - name: integration tests (extension path · NSQL_TEST_DYN=1 · ABI v2 · ODBC = PostgreSQL ODBC via unixODBC)
        env:
          NSQL_TEST_DYN: "1"
          NSQL_ODBC_URL: "odbc:Driver={PostgreSQL Unicode};Server=localhost;Port=5432;Database=nexa;Uid=nexa;Pwd=nexa"
        run: cargo test -p nsql-drivers --test integration -- --nocapture --test-threads=1
      - name: integration tests (extension path · MariaDB)
        env:
          NSQL_TEST_DYN: "1"
          NSQL_MYSQL_URL: mysql://nexa:nexa@localhost:3307/nexa
        run: cargo test -p nsql-drivers --test integration mysql -- --nocapture --test-threads=1
      - name: driver unit tests (duckdb · clickhouse · ext · dyn conformance)
        run: cargo test -p nsql-driver-duckdb -p nsql-driver-clickhouse -p nsql-driver-dyn -p nsql-drivers --test ext
      - name: nsql run (Oracle · MSSQL · MySQL 실기 스크립트)
        run: |
          cargo run -q -p nsql-cli -- run -c "$NSQL_ORACLE_URL" examples/it-oracle.sql
          cargo run -q -p nsql-cli -- run -c "$NSQL_MSSQL_URL" examples/it-mssql.sql
          cargo run -q -p nsql-cli -- run -c "$NSQL_MYSQL_URL" examples/it-mysql.sql
