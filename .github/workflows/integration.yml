# 실서버 통합 테스트 — 각 DBMS를 서비스 컨테이너로(사용자 09-12 "각 DBMS별 docker"). main push · PR · 수동.
# Oracle Free 23ai(gvenzl) + SQL Server 2022 + PostgreSQL 17 + MySQL 8.4(135차 · devcontainer `mysql` 프로필과 같은 정의) + MariaDB 11.4(137차 · 3307).
# ★ 137차(D-350 · 사용자 10-23 "테스트 자동화"): 같은 잡에서 **확장 경로**(NSQL_TEST_DYN=1 · cdylib 8종 · ABI v2)로 한 번 더 · MariaDB는 mysql 시험을 3307로 다시.
name: integration
on:
  push:
    branches: [main]
    paths: ["crates/**", "Cargo.*", ".github/workflows/integration.yml"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  NSQL_ORACLE_URL: oracle://nexa:nexa@localhost:1521/FREEPDB1
  NSQL_MSSQL_URL: mssql://sa:Nexa%40Sql2026@localhost:1433/master
  ORACLE_HOST: localhost
  MSSQL_HOST: localhost
  # scripts/wait-for-db.sh — 서비스 컨테이너는 러너의 localhost로 나온다(기본값 `postgres`는 devcontainer의 호스트 이름).
  POSTGRES_HOST: localhost
  NSQL_PG_URL: postgres://nexa:nexa@localhost:5432/nexa
  MYSQL_HOST: localhost
  NSQL_MYSQL_URL: mysql://nexa:nexa@localhost:3306/nexa
  # ODBC(T-383 · D-345) = 내장 드라이버가 Windows 전용이라 이 Linux 잡에서는 `odbc_` 시험이 건너뛴다(실측 = Windows 로컬 · 저장 프로필).
  LD_LIBRARY_PATH: /opt/oracle/instantclient

defaults:
  run:
    working-directory: nexa-sql

jobs:
  it:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: Nexa_Sql2026
          APP_USER: nexa
          APP_USER_PASSWORD: nexa
        ports: ["1521:1521"]
        options: >-
          --health-cmd "healthcheck.sh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 60
          --health-start-period 60s
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Nexa@Sql2026"
          MSSQL_PID: Developer
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Nexa@Sql2026' -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nexa
          POSTGRES_PASSWORD: nexa
          POSTGRES_DB: nexa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: nexa
          MYSQL_USER: nexa
          MYSQL_PASSWORD: nexa
          MYSQL_DATABASE: nexa
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pnexa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: nexa
          MARIADB_USER: nexa
          MARIADB_PASSWORD: nexa
          MARIADB_DATABASE: nexa
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: nexa-sql
      - uses: actions/checkout@v4
        with:
          repository: SosomLab/nexa-ui
          path: nexa-ui
      - uses: actions/checkout@v4 # 형제 저장소 ../nexa-license(공개 · 검증 전용 · DR-25) — nsql-license가 path 의존
        with:
          repository: SosomLab/nexa-license
          path: nexa-license
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nexa-sql
      - name: Oracle Instant Client (basiclite · linux x64)
        working-directory: .
        run: |
          sudo apt-get update && sudo apt-get install -y libaio1t64 unzip fonts-noto-cjk
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libaio.so.1t64 /usr/lib/x86_64-linux-gnu/libaio.so.1 || true
          sudo mkdir -p /opt/oracle && cd /opt/oracle
          sudo curl -fsSL -o ic.zip https://download.oracle.com/otn_software/linux/instantclient/instantclient-basiclite-linuxx64.zip
          sudo unzip -q ic.zip && sudo rm ic.zip && sudo mv instantclient_* instantclient
          ls /opt/oracle/instantclient | head
      - name: wait for DBs
        run: bash scripts/wait-for-db.sh
      - name: integration tests
        run: cargo test -p nsql-drivers --test integration -- --nocapture --test-threads=1
      - name: integration tests (MariaDB 11.4 · mysql 시험을 3307로)
        env:
          NSQL_MYSQL_URL: mysql://nexa:nexa@localhost:3307/nexa
        run: cargo test -p nsql-drivers --test integration mysql -- --nocapture --test-threads=1
      - name: extension drivers (cdylib 8종 · duckdb = download-lib)
        run: cargo build -p nsql-driver-sqlite -p nsql-driver-pg -p nsql-driver-mysql -p nsql-driver-mssql -p nsql-driver-oracle-thin -p nsql-driver-oracle -p nsql-driver-duckdb
      - name: integration tests (extension path · NSQL_TEST_DYN=1 · ABI v2)
        env:
          NSQL_TEST_DYN: "1"
        run: cargo test -p nsql-drivers --test integration -- --nocapture --test-threads=1
      - name: integration tests (extension path · MariaDB)
        env:
          NSQL_TEST_DYN: "1"
          NSQL_MYSQL_URL: mysql://nexa:nexa@localhost:3307/nexa
        run: cargo test -p nsql-drivers --test integration mysql -- --nocapture --test-threads=1
      - name: driver unit tests (duckdb · ext · dyn conformance)
        run: cargo test -p nsql-driver-duckdb -p nsql-driver-dyn -p nsql-drivers --test ext
      - name: nsql run (Oracle · MSSQL · MySQL 실기 스크립트)
        run: |
          cargo run -q -p nsql-cli -- run -c "$NSQL_ORACLE_URL" examples/it-oracle.sql
          cargo run -q -p nsql-cli -- run -c "$NSQL_MSSQL_URL" examples/it-mssql.sql
          cargo run -q -p nsql-cli -- run -c "$NSQL_MYSQL_URL" examples/it-mysql.sql
