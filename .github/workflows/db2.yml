# IBM Db2 실서버 통합 시험 — 별도 잡(138차 · D-361 · docs/121b): Db2 Community 컨테이너(≈2.6 GB · privileged · 기동 1~2분)라 본 integration 잡에
# 넣지 않고 **수동 + 야간 + Db2 관련 경로의 PR**에서만 돈다. 드라이버 = **네이티브 DRDA**(`nsql-driver-db2` · 순수 Rust) → clidriver·unixODBC 없이
# `db2://db2inst1:…@localhost:50000/nexa`로 바로 붙는다(1~7차 ODBC 경로 시도 = journal 10-25 · 서버 lib64 없이는 불가 → D-361).
name: db2
on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *" # 03:17 KST
  pull_request:
    paths:
      - "crates/nsql-driver-db2/**"
      - "crates/nsql-catalog/**"
      - "crates/nsql-core/src/dberr.rs"
      - "crates/nsql-core/src/caps.rs"
      - "crates/nsql-drivers/tests/integration.rs"
      - ".github/workflows/db2.yml"

env:
  CARGO_TERM_COLOR: always
  NSQL_DB2_URL: db2://db2inst1:Nexa_Sql2026@localhost:50000/nexa

defaults:
  run:
    working-directory: nexa-sql

jobs:
  db2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db2:
        image: icr.io/db2_community/db2:12.1.2.0
        env:
          LICENSE: accept
          DB2INST1_PASSWORD: Nexa_Sql2026
          DBNAME: nexa
          ARCHIVE_LOGS: "false"
          AUTOCONFIG: "false"
          UPDATEAVAIL: "NO"
          PERSISTENT_HOME: "false"
        ports: ["50000:50000"]
        options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          path: nexa-sql
      - uses: actions/checkout@v4
        with:
          repository: SosomLab/nexa-ui
          path: nexa-ui
      - uses: actions/checkout@v4
        with:
          repository: SosomLab/nexa-license
          path: nexa-license
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nexa-sql
      - name: driver unit tests (DRDA 코덱 · FD:OCA · SQLCA)
        run: cargo test -p nsql-driver-db2
      - name: wait for Db2 (Setup has completed · 최대 10분)
        run: |
          for i in $(seq 1 120); do
            if docker logs "${{ job.services.db2.id }}" 2>&1 | grep -q 'Setup has completed'; then echo "db2 ready"; exit 0; fi
            sleep 5
          done
          echo "db2 not ready"; docker logs "${{ job.services.db2.id }}" 2>&1 | tail -50; exit 1
      - name: integration tests (db2 · 네이티브 DRDA · 크레이트 직접 · NSQL_TRACE_DRDA 송수신 hexdump)
        env:
          NSQL_TRACE_DRDA: "4096"
        run: cargo test -p nsql-drivers --test integration db2_ -- --nocapture --test-threads=1
      - name: integration tests (db2 · 확장 경로 · NSQL_TEST_DYN=1 · cdylib)
        env:
          NSQL_TEST_DYN: "1"
          NSQL_TRACE_DRDA: "4096"
        run: |
          cargo build -p nsql-driver-db2
          cargo test -p nsql-drivers --test integration db2_ -- --nocapture --test-threads=1
      # ★ T-426 2차 ⑤: 서버 인증을 SERVER_ENCRYPT로 바꿔(DES 수용 = ALTERNATE_AUTH_ENC NOT_SPECIFIED · 인스턴스 재시작) EUSRIDPWD(SECMEC 9) 실접속을 본다.
      #   평문 3은 이 뒤 거절될 수 있어 기존 5종 두 단계 **뒤에** 둔다(협업 조사 10-25 · IBM Docs c0005435 · r0053734).
      - name: switch auth to SERVER_ENCRYPT (SECMEC 9 · 기존 시험 뒤)
        timeout-minutes: 6
        run: |
          ID="${{ job.services.db2.id }}"
          X() { docker exec "$ID" su - db2inst1 -c "$1"; }
          X "db2 update dbm cfg using AUTHENTICATION SERVER_ENCRYPT ALTERNATE_AUTH_ENC NOT_SPECIFIED"
          X "db2 terminate; db2stop force; db2start"
          for i in $(seq 1 36); do
            if X "db2 connect to nexa >/dev/null && db2 connect reset >/dev/null"; then echo "db2 back ($i)"; break; fi
            [ "$i" = 36 ] && { echo "db2 not back"; exit 1; }
            sleep 5
          done
          X "db2 get dbm cfg | grep -Ei 'AUTHENTICATION|ALTERNATE_AUTH_ENC|SRVCON_AUTH'; db2set -all" || true
      - name: integration test (db2 · SECMEC 9 · SERVER_ENCRYPT · 내장)
        timeout-minutes: 5
        env:
          NSQL_DB2_EXPECT_SECMEC9: "1"
          NSQL_TRACE_DRDA: "4096"
        run: cargo test -p nsql-drivers --test integration db2enc_secmec9_encrypted_login -- --nocapture --test-threads=1 --exact
      - name: integration test (db2 · SECMEC 9 · SERVER_ENCRYPT · 확장 경로)
        timeout-minutes: 5
        env:
          NSQL_DB2_EXPECT_SECMEC9: "1"
          NSQL_TEST_DYN: "1"
          NSQL_TRACE_DRDA: "4096"
        run: cargo test -p nsql-drivers --test integration db2enc_secmec9_encrypted_login -- --nocapture --test-threads=1 --exact
      # 실패 진단: 서버 db2diag.log 끝 + DRDA 덤프(RECEIVE/SEND BUFFER)를 아티팩트로(10-25 첫 실접속 = sqljcReadHdrAs PROTOCOL ERROR).
      - name: db2diag (on failure)
        if: failure()
        working-directory: .
        run: |
          ID="${{ job.services.db2.id }}"
          docker exec "$ID" bash -lc 'tail -300 /home/db2inst1/sqllib/db2dump/db2diag.log' > db2diag-tail.log 2>&1 || true
          docker cp "$ID:/home/db2inst1/sqllib/db2dump/." db2dump 2>/dev/null || true
          grep -n 'sqljc\|PROTOCOL\|DRDA\|RECEIVE BUFFER' db2diag-tail.log | head -40 || true
          for f in $(ls db2dump/DIAG0000/*.dump.bin 2>/dev/null | head -3); do echo "== $f"; xxd "$f" | head -40; done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: db2-diag
          path: |
            db2diag-tail.log
            db2dump/DIAG0000/*.dump.bin
            db2dump/*.log
          if-no-files-found: ignore
