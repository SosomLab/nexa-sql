# IBM Db2 실서버 통합 시험 — 별도 잡(138차 · D-359 · docs/121a §①): Db2 Community 컨테이너(≈2.6 GB · privileged · 기동 1~2분)라 본
# integration 잡에 넣지 않고 **수동 + 야간 + Db2 관련 경로의 PR**에서만 돈다. 드라이버 = IBM clidriver(공개 HTTP 다운로드 · 사용자 설치와 같은 방식)를
# unixODBC에 등록(`IBM DB2 ODBC DRIVER`) → `db2://db2inst1:…@localhost:50000/nexa`(내장 ODBC 어댑터 위 `Dialect::Db2`).
name: db2
on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *" # 03:17 KST
  pull_request:
    paths:
      - "crates/nsql-driver-odbc/**"
      - "crates/nsql-catalog/**"
      - "crates/nsql-core/src/dberr.rs"
      - "crates/nsql-core/src/caps.rs"
      - "crates/nsql-drivers/tests/integration.rs"
      - ".github/workflows/db2.yml"

env:
  CARGO_TERM_COLOR: always
  NSQL_DB2_URL: db2://db2inst1:Nexa_Sql2026@localhost:50000/nexa

defaults:
  run:
    working-directory: nexa-sql

jobs:
  db2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      db2:
        image: icr.io/db2_community/db2:12.1.2.0
        env:
          LICENSE: accept
          DB2INST1_PASSWORD: Nexa_Sql2026
          DBNAME: nexa
          ARCHIVE_LOGS: "false"
          AUTOCONFIG: "false"
          UPDATEAVAIL: "NO"
          PERSISTENT_HOME: "false"
        ports: ["50000:50000"]
        options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          path: nexa-sql
      - uses: actions/checkout@v4
        with:
          repository: SosomLab/nexa-ui
          path: nexa-ui
      - uses: actions/checkout@v4
        with:
          repository: SosomLab/nexa-license
          path: nexa-license
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nexa-sql
      - name: unixODBC + IBM clidriver(linuxx64 · odbcinst 등록)
        working-directory: .
        run: |
          # ubuntu 24.04: `unixodbc-dev`만으로는 `odbcinst` 실행 파일이 없다(첫 실행 40108437673 exit 127) → unixodbc + odbcinst 함께.
          sudo apt-get update && sudo apt-get install -y unixodbc-dev unixodbc odbcinst
          sudo mkdir -p /opt/ibm && cd /opt/ibm
          # ★ v12.1.4 linuxx64 패키지의 libdb2.so = SQLLEN 32비트 빌드 → odbc-api 길이 표시자 패닉(40109120417) · unixODBC용 64비트 판 = libdb2o.so.
          #   11.5.9·12.1.4 둘 다 libdb2o.so 없음(4차 확정) → 아래 단계가 서버 컨테이너의 lib64를 꺼낸다 · 여기선 받아 두기만(폴백).
          # 12.1.4(최신 · 서버 12.1과 같은 계열) — 아래 단계가 서버의 libdb2o.so.1을 이 트리에 끼운다(msg/cfg는 clidriver 것).
          sudo curl -fsSL -o cli.tar.gz https://public.dhe.ibm.com/ibmdl/export/pub/software/data/db2/drivers/odbc_cli/linuxx64_odbc_cli.tar.gz
          sudo tar xzf cli.tar.gz && sudo rm cli.tar.gz
          find /opt/ibm/clidriver -name 'libdb2o*' -o -name 'libdb2.so*' | sort
      - name: wait for Db2 (Setup has completed · 최대 10분)
        run: |
          for i in $(seq 1 120); do
            if docker logs "${{ job.services.db2.id }}" 2>&1 | grep -q 'Setup has completed'; then echo "db2 ready"; exit 0; fi
            sleep 5
          done
          echo "db2 not ready"; docker logs "${{ job.services.db2.id }}" 2>&1 | tail -50; exit 1
      # ★ 4차(40109857978)로 확정: Linux clidriver(11.5.9 · 12.1.4)는 libdb2.so(SQLLEN 32비트)만 동봉 → unixODBC(64비트 SQLLEN)와 안 맞아
      #   길이 표시자 오류. 64비트 판 libdb2o.so는 **전체 Db2 서버/클라이언트 설치본(sqllib/lib64)** 에 있다. 5차(40110495407) = 서버 lib64만
      #   꺼내 쓰면 msg/cfg·인스턴스 환경이 없어 IM004·SQL10007N → **하이브리드**: clidriver 트리(msg·cfg · 인스턴스 불필요)에 서버의
      #   libdb2o.so.1 하나만 끼운다(같은 12.1 계열). CI 전용 · 사용자는 Db2 클라이언트/dsdriver 설치(docs/wiki/Drivers).
      - name: ODBC driver = clidriver 트리 + 컨테이너 lib64의 libdb2o.so.1 (없으면 clidriver libdb2.so 폴백)
        working-directory: .
        run: |
          ID="${{ job.services.db2.id }}"
          SRC=$(docker exec "$ID" bash -lc 'ls -d /opt/ibm/db2/V*/lib64 2>/dev/null | head -1')
          echo "server lib64 = $SRC"
          LIB=/opt/ibm/clidriver/lib/libdb2.so
          if [ -n "$SRC" ] && docker exec "$ID" test -f "$SRC/libdb2o.so.1"; then
            docker cp "$ID:$SRC/libdb2o.so.1" /tmp/libdb2o.so.1
            sudo cp /tmp/libdb2o.so.1 /opt/ibm/clidriver/lib/libdb2o.so.1
            sudo ln -sf libdb2o.so.1 /opt/ibm/clidriver/lib/libdb2o.so
            ls -l /opt/ibm/clidriver/lib/libdb2o.so /opt/ibm/clidriver/lib/libdb2o.so.1 /opt/ibm/clidriver/lib/libdb2.so.1
            LD_LIBRARY_PATH=/opt/ibm/clidriver/lib ldd /opt/ibm/clidriver/lib/libdb2o.so.1 | grep -i 'not found\|libdb2' || true
            LIB=/opt/ibm/clidriver/lib/libdb2o.so
          else
            echo "::warning::libdb2o.so.1 not found in server container; falling back to clidriver libdb2.so (32-bit SQLLEN)"
          fi
          echo "ODBC driver lib = $LIB"
          echo "DB2_ODBC_LIBDIR=$(dirname "$LIB")" >> "$GITHUB_ENV"
          printf '[IBM DB2 ODBC DRIVER]\nDescription=IBM Data Server Driver for ODBC and CLI\nDriver=%s\nFileUsage=1\nDontDLClose=1\n' "$LIB" | sudo tee -a /etc/odbcinst.ini
          odbcinst -q -d
      - name: integration tests (db2 · 내장 ODBC 경로)
        env:
          LD_LIBRARY_PATH: ${{ env.DB2_ODBC_LIBDIR }}
        run: cargo test -p nsql-drivers --test integration db2_ -- --nocapture --test-threads=1
      - name: integration tests (db2 · 확장 경로 · NSQL_TEST_DYN=1)
        env:
          LD_LIBRARY_PATH: ${{ env.DB2_ODBC_LIBDIR }}
          NSQL_TEST_DYN: "1"
        run: |
          cargo build -p nsql-driver-odbc
          cargo test -p nsql-drivers --test integration db2_ -- --nocapture --test-threads=1
