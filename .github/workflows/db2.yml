# IBM Db2 실서버 통합 시험 — 별도 잡(138차 · D-361 · docs/121b): Db2 Community 컨테이너(≈2.6 GB · privileged · 기동 1~2분)라 본 integration 잡에
# 넣지 않고 **수동 + 야간 + Db2 관련 경로의 PR**에서만 돈다. 드라이버 = **네이티브 DRDA**(`nsql-driver-db2` · 순수 Rust) → clidriver·unixODBC 없이
# `db2://db2inst1:…@localhost:50000/nexa`로 바로 붙는다(1~7차 ODBC 경로 시도 = journal 10-25 · 서버 lib64 없이는 불가 → D-361).
name: db2
on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *" # 03:17 KST
  pull_request:
    paths:
      - "crates/nsql-driver-db2/**"
      - "crates/nsql-catalog/**"
      - "crates/nsql-core/src/dberr.rs"
      - "crates/nsql-core/src/caps.rs"
      - "crates/nsql-drivers/tests/integration.rs"
      - ".github/workflows/db2.yml"

env:
  CARGO_TERM_COLOR: always
  NSQL_DB2_URL: db2://db2inst1:Nexa_Sql2026@localhost:50000/nexa

defaults:
  run:
    working-directory: nexa-sql

jobs:
  db2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      db2:
        image: icr.io/db2_community/db2:12.1.2.0
        env:
          LICENSE: accept
          DB2INST1_PASSWORD: Nexa_Sql2026
          DBNAME: nexa
          ARCHIVE_LOGS: "false"
          AUTOCONFIG: "false"
          UPDATEAVAIL: "NO"
          PERSISTENT_HOME: "false"
        ports: ["50000:50000"]
        options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          path: nexa-sql
      - uses: actions/checkout@v4
        with:
          repository: SosomLab/nexa-ui
          path: nexa-ui
      - uses: actions/checkout@v4
        with:
          repository: SosomLab/nexa-license
          path: nexa-license
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nexa-sql
      - name: driver unit tests (DRDA 코덱 · FD:OCA · SQLCA)
        run: cargo test -p nsql-driver-db2
      - name: wait for Db2 (Setup has completed · 최대 10분)
        run: |
          for i in $(seq 1 120); do
            if docker logs "${{ job.services.db2.id }}" 2>&1 | grep -q 'Setup has completed'; then echo "db2 ready"; exit 0; fi
            sleep 5
          done
          echo "db2 not ready"; docker logs "${{ job.services.db2.id }}" 2>&1 | tail -50; exit 1
      - name: integration tests (db2 · 네이티브 DRDA · 크레이트 직접)
        run: cargo test -p nsql-drivers --test integration db2_ -- --nocapture --test-threads=1
      - name: integration tests (db2 · 확장 경로 · NSQL_TEST_DYN=1 · cdylib)
        env:
          NSQL_TEST_DYN: "1"
        run: |
          cargo build -p nsql-driver-db2
          cargo test -p nsql-drivers --test integration db2_ -- --nocapture --test-threads=1
