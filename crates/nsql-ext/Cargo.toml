[package]
name = "nsql-ext"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Nexa SQL extension package core (T-166 E8) — index.json/extension.json parsing, SHA-256, package check/pack, index signature verify (Ed25519 · nexa-license) shared by the GUI manager and `nsql ext`"

[lints]
workspace = true

[dependencies]
nsql-json.workspace = true
# 색인 서명 검증만(D-373 · 서명 생성은 nexa-license-tool `sign-file` · 앱·CLI는 검증 전용).
nexa-license = { workspace = true, features = ["ed25519"] }

[dev-dependencies]
# 시험 전용 키쌍 생성·서명(발급 코드가 아니다 · #[cfg(test)]) — nsql-license 시험과 같은 판.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
