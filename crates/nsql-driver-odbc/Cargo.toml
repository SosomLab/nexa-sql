[package]
name = "nsql-driver-odbc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Nexa SQL adapter - ODBC (odbc-api). DSN or driver connection strings, ? binds, block fetch, autocommit off"

[lints]
workspace = true

# ★ D-350(10-23): 모든 드라이버 = 확장 설치형 — rlib(내장 · 개발·시험) + cdylib(`nsql_driver_<id>` · ABI v2 · 배포).
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
nsql-core.workspace = true
nsql-script.workspace = true
nsql-abi.workspace = true

# DR-3 예외(드라이버 · docs/10 §4 원장 · T-383). 시스템 ODBC 드라이버 관리자 위의 순수 Rust 바인딩(MIT) · `prompt`(winit)·`derive` 끔.
# ★ D-345: 내장 ODBC = **Windows만**(인박스 odbc32.dll · 설치 0). macOS/Linux는 이 크레이트가 빈 스텁으로 컴파일된다 —
#   unixODBC는 LGPL-2.1이라 정적 동봉이 고지·재링크 요건을 부르고, 동적 링크는 실행 파일에 런타임 의존을 만든다
#   (64 §4 "외부 네이티브 의존 0") → 후속 = 확장 드라이버(cdylib · DR-29) 또는 패키지 의존을 받아들이는 동적 링크(사용자 결정 대기).
# ★ D-350(10-24): 모든 OS에서 컴파일 — Windows = 인박스 odbc32(내장도 가능) · Linux/macOS = unixODBC **동적 링크**(LGPL = 동적 OK ·
#   빌드 = unixodbc-dev/brew unixodbc · 런타임 = 시스템 libodbc · **확장 전용**(허브 내장은 Windows만 · 64 §4 "외부 의존 0" 유지) · D-346 ⓐ 확정).
[dependencies.odbc-api]
version = "29.2"
default-features = false
features = ["odbc_version_3_80"]

# ★ D-361 실험(10-25 · 사용자 "드라이버 파일은 정적으로"): Linux/macOS = unixODBC 드라이버 관리자를 **정적으로 동봉**(`vendored-unix-odbc` =
#   unix-odbc crate가 소스 빌드 · LGPL-2.1 재링크 요건 = 공개 저장소 소스로 충족 · 고지) → 시스템 libodbc 불필요 · 벤더 드라이버만 사용자 설치.
[target.'cfg(not(windows))'.dependencies.odbc-sys]
version = "0.31"
default-features = false
features = ["odbc_version_3_80", "vendored-unix-odbc"]
