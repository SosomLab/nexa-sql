[package]
name = "nsql-driver-duckdb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Nexa SQL 어댑터 — DuckDB(duckdb-rs · libduckdb 동적 링크 · 확장 전용 cdylib · D-350)"

[lints]
workspace = true

# ★ D-350: 확장 전용 — 내장 feature 없음(libduckdb ≈ 50 MB · 설치본에 넣지 않는다). rlib는 시험용.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
nsql-core.workspace = true
nsql-script.workspace = true
nsql-abi.workspace = true
# DR-3 예외(드라이버 · docs/10 §4 원장): duckdb-rs(MIT) · libduckdb-sys `download-lib` = 빌드 때 공식 prebuilt libduckdb를 받아 **동적 링크**
#   (소스 빌드 없음 · 런타임 = 패키지 안의 duckdb.dll/libduckdb.so/.dylib · 로더가 cdylib 폴더를 먼저 찾는다).
duckdb = { version = "1.2", default-features = false, features = ["download-lib"] }
