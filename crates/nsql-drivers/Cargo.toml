[package]
name = "nsql-drivers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Nexa SQL 드라이버 레지스트리 — 접속 문자열/ConnectSpec → Box<dyn Session> (feature로 어댑터 선택)"

[lints]
workspace = true

[features]
default = ["sqlite", "oracle", "oracle-thin", "mssql", "pg", "mysql", "odbc"]
sqlite = ["dep:nsql-driver-sqlite"]
oracle = ["dep:nsql-driver-oracle"]
# Oracle Thin(순수 Rust · Instant Client 불필요 · docs/110) — 표준판 = oracle + oracle-thin · 경량판 C = oracle-thin만(64 §4-1).
oracle-thin = ["dep:nsql-driver-oracle-thin"]
mssql = ["dep:nsql-driver-mssql"]
pg = ["dep:nsql-driver-pg"]
# MySQL/MariaDB(순수 Rust · 사용자 10-22 · 135차) — 같은 드라이버 · `mariadb://`는 별칭.
mysql = ["dep:nsql-driver-mysql"]
# ODBC 일반(시스템 드라이버 관리자 · 사용자 10-21 확정 P2 · T-383 · 136차) — Tibero·Altibase·CUBRID·Db2·HANA·Access·Excel 3급.
odbc = ["dep:nsql-driver-odbc"]

[dependencies]
nsql-core.workspace = true
nsql-script.workspace = true
# ★ 확장 드라이버 로더(DR-29 · T-27 ③) — 내장이 없는 방언은 `drivers/<id>/<ver>/` cdylib로 폴백(지연 로드 · 외부 crate 0).
nsql-driver-dyn.workspace = true
# 확장 매니페스트 `nexa-driver.json`(T-28) · ABI 버전 검사.
nsql-json.workspace = true
nsql-abi.workspace = true
# ★ T-29 다운로드·설치: HTTPS(nsql-net) · Ed25519 검증(nexa-license 검증 어댑터 · 공개키 = ext/keys.rs) · zip deflate 해제(miniz_oxide · 순수 Rust · 이미 트리 안 · D-348).
nsql-net.workspace = true
nexa-license = { workspace = true, features = ["ed25519"] }
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
nsql-driver-sqlite = { workspace = true, optional = true }
nsql-driver-oracle = { workspace = true, optional = true }
nsql-driver-oracle-thin = { workspace = true, optional = true }
nsql-driver-mssql = { workspace = true, optional = true }
nsql-driver-pg = { workspace = true, optional = true }
nsql-driver-mysql = { workspace = true, optional = true }
# ★ 10-23(3a9f127 · 5179fe7): ODBC 내장 = 전 OS — Windows 인박스 odbc32 · Linux/macOS unixODBC(libodbc 동적 링크 · CI는 unixodbc-dev/brew 설치 단계). 종전 D-345 "Windows만"은 폐기.
nsql-driver-odbc = { workspace = true, optional = true }

[dev-dependencies]
nsql-run.workspace = true
# Db2 통합 시험(138차 · D-359)이 카탈로그 층(SYSCAT 질의)까지 실서버로 검증한다 — nsql-catalog는 nsql-core만 의존(순환 없음).
nsql-catalog.workspace = true
# ★ ClickHouse(138차 · 확장 전용)는 내장 feature가 없어 통합 시험이 크레이트를 직접 연다(확장 경로 = NSQL_TEST_DYN=1 · cdylib).
nsql-driver-clickhouse.workspace = true
# 설치 왕복 시험 전용 서명(발급 코드가 아니다 · nsql-license 시험과 같은 판).
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
# 통합 테스트를 저장된 프로필로도 돌린다(`NSQL_PG_PROFILE=<이름>` — 비밀번호를 환경 변수에 적지 않는다).
nsql-vault.workspace = true
