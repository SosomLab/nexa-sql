[package]
name = "nexa-sql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Nexa SQL — GUI(최소 슬라이스: 접속 · SQL 편집 · 실행 · 결과 그리드 · 상태줄). nexa-ui 위에 그린다"
# Windows 실행 파일 아이콘·버전 리소스(T-62) — rc.exe/windres가 있을 때만 · 외부 crate 0 · 다른 OS 불변.
build = "build.rs"

[lints]
workspace = true

[dependencies]
nsql-core.workspace = true
nsql-script.workspace = true
nsql-run.workspace = true
nsql-drivers.workspace = true
nsql-catalog.workspace = true
nsql-vault.workspace = true
nsql-io.workspace = true
nsql-search.workspace = true
nsql-i18n.workspace = true
nsql-settings.workspace = true
nsql-log.workspace = true
nexa-gfx.workspace = true
nexa-ctl.workspace = true
nexa-font.workspace = true
nexa-fs.workspace = true
nexa-dlg.workspace = true
encoding_rs.workspace = true
fancy-regex.workspace = true
# 창·입력(winit) + CPU 픽셀 제출(softbuffer) — clip/beep과 같은 판(실증 조합). Linux는 Wayland/X11 런타임 dlopen.
winit = { version = "0.30", features = ["wayland-dlopen"] }
softbuffer = { version = "0.4", features = ["wayland-dlopen"] }

# ── macOS 타깃 한정(다른 OS 산출물 불변) — Dock 아이콘(`icon::set_dock_icon` · 사용자 09-16 "셸 실행처럼 보여").
# winit과 같은 판(objc2 0.5 · app-kit/foundation 0.2 = Cargo.lock 동일 항목 · 의존 트리 중복 0) · nexa-clip `nclip-plat` 선례 ·
# 원장 docs/10 §4.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = [
    "NSApplication",
    "NSResponder",
    "NSImage",
    "NSImageRep",
    "NSBitmapImageRep",
] }
objc2-foundation = { version = "0.2", features = ["NSString", "NSGeometry", "NSThread"] }
