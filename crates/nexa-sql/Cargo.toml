[package]
name = "nexa-sql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Nexa SQL — GUI(최소 슬라이스: 접속 · SQL 편집 · 실행 · 결과 그리드 · 상태줄). nexa-ui 위에 그린다"

[lints]
workspace = true

[dependencies]
nsql-core.workspace = true
nsql-script.workspace = true
nsql-run.workspace = true
nsql-drivers.workspace = true
nsql-catalog.workspace = true
nsql-vault.workspace = true
nsql-io.workspace = true
nsql-i18n.workspace = true
nsql-settings.workspace = true
nsql-log.workspace = true
nexa-gfx.workspace = true
nexa-ctl.workspace = true
nexa-font.workspace = true
# 창·입력(winit) + CPU 픽셀 제출(softbuffer) — clip/beep과 같은 판(실증 조합). Linux는 Wayland/X11 런타임 dlopen.
winit = { version = "0.30", features = ["wayland-dlopen"] }
softbuffer = { version = "0.4", features = ["wayland-dlopen"] }
