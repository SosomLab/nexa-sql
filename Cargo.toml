# Nexa SQL — 크로스플랫폼 경량 SQL 클라이언트 (올 러스트 · nexa-ui 위에 그린다)
# 아키텍처 = docs/01 · 결정 = docs/10 · 세션 변수 엔진 = docs/08.
# 크레이트 경계는 단방향 — 드라이버·UI가 nsql-core에 의존, core는 아무것도 모른다.
# 외부 crate: DB 드라이버는 불가피하므로 "드라이버 크레이트만 예외"(DR-3) — 그 외는 docs/10 §3 원장.
[workspace]
resolver = "2"
members = [
  "crates/nsql-core",     # 도메인 — Dialect · Value · 결과셋 · 세션 포트 (의존 0)
  "crates/nsql-script",   # ★ SQL*Plus식 스크립트 엔진 — 문장 분리 · 바인드/치환 변수 · EXEC/CONNECT · 방언 재작성 (의존: core)
  "crates/nsql-io",       # export 작성기(csv/tsv/json/jsonl/insert/텍스트 표) · CSV 파서 (의존: core)
  "crates/nsql-run",      # ★ 오케스트레이션 — 엔진 Action ↔ Session 실행 · OUT 흡수 · 이벤트 (GUI·CLI 공용)
  "crates/nsql-i18n",     # 메시지 카탈로그 — 컴파일 타임 [en, ko] · 기본 영어 · 의존 0 (T-37)
  "crates/nsql-log",      # 실행 로그 — 타임스탬프 첫 컬럼 · Raw/Markdown/Grid 어댑터 · 링 버퍼 · 의존 0 (사용자 09-14)
  "crates/nsql-settings", # 앱 설정 — 레지스트리(단일 원천) + settings.conf(nexa-conf) · 언어·테마 모드 (T-37/38)
  "crates/nsql-vault",    # ★ 연결 프로필 저장소 — 사용자 폴더에 비밀번호 봉투(ChaCha20-Poly1305 · 기기 키 DPAPI) · CLI·GUI 공용 (DR-22)
  "crates/nsql-driver-sqlite", # ① 어댑터 — rusqlite(bundled) · 실DB 검증용
  "crates/nsql-driver-oracle", # ① 어댑터 — oracle(kubo · ODPI-C · Instant Client 런타임 로드)
  "crates/nsql-driver-mssql",  # ① 어댑터 — tiberius(TDS) · DECLARE @v = @Pn 배치 + 트레일러 SELECT로 OUT 회수
  "crates/nsql-driver-pg",     # ① 어댑터 — rust-postgres(동기) · $n 바인드 · 단순 질의 텍스트 폴백 (사용자 09-15)
  "crates/nsql-drivers",  # 접속 문자열 → Box<dyn Session> 레지스트리(feature로 어댑터 선택)
  "crates/nsql-search",   # ★ 파일 검색 엔진 — 병렬 폴더 걷기 · .gitignore 부분집합 · SWAR 리터럴/정규식 매칭 · 스트리밍 · 취소 (GUI 파일 검색 · CLI grep 공용 · T-81b)
  "crates/nsql-catalog",  # ★ 카탈로그 — 스키마·오브젝트·컬럼·소스·컴파일 오류(방언별 메타 SQL · Session 포트 위 · GUI 탐색기·CLI cat 공용)
  "crates/nsql-cli",      # (bin `nsql`) ★ CLI — 접속·스크립트 실행·export/import·bulk insert. 지금은 dry-run 플래너
  "crates/nexa-sql",      # (bin) GUI 진입 — M1에서 nexa-ui 위에 창을 연다
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.89"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
authors = ["Sangyong Bae <kiros33@gmail.com>"]
repository = "https://github.com/SosomLab/nexa-sql"
homepage = "https://sosomlab.com"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
redundant_clone = "warn"
inefficient_to_string = "warn"
unwrap_used = "warn"

[workspace.dependencies]
nsql-core = { path = "crates/nsql-core" }
nsql-script = { path = "crates/nsql-script" }
nsql-io = { path = "crates/nsql-io" }
nsql-run = { path = "crates/nsql-run" }
nsql-driver-sqlite = { path = "crates/nsql-driver-sqlite" }
nsql-driver-oracle = { path = "crates/nsql-driver-oracle" }
nsql-driver-mssql = { path = "crates/nsql-driver-mssql" }
nsql-driver-pg = { path = "crates/nsql-driver-pg" }
nsql-drivers = { path = "crates/nsql-drivers" }
nsql-catalog = { path = "crates/nsql-catalog" }
nsql-vault = { path = "crates/nsql-vault" }
nsql-i18n = { path = "crates/nsql-i18n" }
nsql-settings = { path = "crates/nsql-settings" }
nsql-log = { path = "crates/nsql-log" }
nsql-search = { path = "crates/nsql-search" }
# 파일 인코딩(EUC-KR·Shift_JIS·GB18030·Big5·CP1252) — WHATWG 코덱 · 순수 Rust · DR-3 예외(docs/10 원장 · 09-16).
encoding_rs = "0.8"
# 정규식(D-76 · 09-16): regex(선형 시간) 위 fancy-regex(lookaround·역참조만 백트래킹) — 순수 Rust.
fancy-regex = "0.14"
# 파일 검색 엔진(nsql-search · T-81b)은 선형 시간 코어 `regex`만 쓴다(lookaround가 필요한 GUI 찾기 바는 fancy-regex).
regex = "1"
# nexa-ui(공용 UI) — M1 UI 착수 시 사용. 경로 의존(DR-4 · nexa-ui DR-4).
nexa-gfx = { path = "../nexa-ui/crates/nexa-gfx" }
nexa-ctl = { path = "../nexa-ui/crates/nexa-ctl" }
nexa-conf = { path = "../nexa-ui/crates/nexa-conf" }
nexa-font = { path = "../nexa-ui/crates/nexa-font" }
nexa-fs = { path = "../nexa-ui/crates/nexa-fs" }
nexa-dlg = { path = "../nexa-ui/crates/nexa-dlg" }
nexa-sys = { path = "../nexa-ui/crates/nexa-sys" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
